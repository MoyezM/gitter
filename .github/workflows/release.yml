# Tag push (v*) -> build a release binary per published platform with the tag
# baked in, gate each on portability (no /nix/store references), strip + (on
# macOS) ad-hoc re-sign, then a single publish job writes ONE combined
# checksums.txt and cuts the GitHub release. The Homebrew tap update runs
# last and stays macOS-only (skipped when HOMEBREW_TAP_TOKEN is unset).
name: release

on:
  push:
    tags: ['v*']
  # Dry run: builds, gates and packages both platforms and uploads the
  # tarballs as workflow artifacts, but publishes nothing — the publish job
  # (and therefore the tap jobs, which need it) is gated on the tag push.
  # Lets the whole artifact pipeline be exercised without burning a version.
  workflow_dispatch:
    inputs:
      version:
        description: 'version stamped into the dry-run binaries'
        default: v0.0.0-dryrun

jobs:
  build:
    # ubuntu-22.04 rather than -latest deliberately: the release binary links
    # against the runner's glibc, so the runner's version IS the floor users
    # need. 22.04's 2.35 covers far more of the field than 24.04's 2.39.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@v35

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      # Same explicit restore/save + skip-on-exact-hit as ci.yml — in the
      # normal flow CI has already populated this cache, so a release run
      # skips bootstrap entirely.
      - uses: actions/cache/restore@v4
        id: opam-cache
        with:
          path: ~/.opam
          key: opam-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gitter.opam', 'scripts/bootstrap', 'flake.lock') }}
          restore-keys: |
            opam-v3-${{ runner.os }}-${{ runner.arch }}-
            opam-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: bootstrap opam switch
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: nix develop path:. -c ./scripts/bootstrap

      - name: prune opam cache
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: ./scripts/ci-prune-opam

      - uses: actions/cache/save@v4
        if: steps.opam-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.opam
          key: opam-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gitter.opam', 'scripts/bootstrap', 'flake.lock') }}

      # ONE implementation of the release recipe, shared with local builds.
      # scripts/build-release resolves the platform from uname, builds in the
      # #ci shell, runs the portability gate for this object format, strips
      # (and ad-hoc re-signs on macOS), checks the version stamp and writes
      # the tarball. Everything platform-specific lives in that script rather
      # than being spelled out again here in YAML: a second copy of the recipe
      # is a copy that drifts, and the script is the thing you can run locally
      # to reproduce what shipped.
      - name: build, gate and package
        run: ./scripts/build-release --version "${{ inputs.version || github.ref_name }}" --tarball

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.platform }}
          # build-release also writes a single-entry dist/checksums.txt; the
          # publish job recomputes one combined file across every platform, so
          # only the tarball travels.
          path: dist/gitter-*.tar.gz
          if-no-files-found: error

  # One release, one checksums.txt. Each build leg publishing its own would
  # clobber the other's — and scripts/install.sh refuses to install without
  # an entry for its asset in that file.
  publish:
    needs: build
    # Never on a dry run — this is the step that creates the release, and
    # update-tap/verify-* need it, so gating here gates all of them.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          merge-multiple: true

      - name: checksums
        run: |
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            gitter-*.tar.gz
            checksums.txt
          generate_release_notes: true

  update-tap:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      updated: ${{ steps.guard.outputs.have_token }}
    steps:
      # secrets can't gate a job-level if — probe in a step, gate the rest on
      # its output. A missing token is fine; the tap just doesn't get updated.
      - name: check for tap token
        id: guard
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "no HOMEBREW_TAP_TOKEN — skipping tap update"
            echo "have_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.have_token == 'true'

      - name: download checksums
        if: steps.guard.outputs.have_token == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.ref_name }}" --pattern checksums.txt

      # The tap is macOS-only: update-tap.sh picks the macos-arm64 line out of
      # the combined checksums.txt by exact filename, so the linux entry
      # sitting alongside it changes nothing.
      - name: update tap
        if: steps.guard.outputs.have_token == 'true'
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/MoyezM/homebrew-tap.git" tap
          TAG="$TAG" CHECKSUMS_FILE="$PWD/checksums.txt" TAP_DIR="$PWD/tap" \
            ./scripts/release/update-tap.sh
          git -C tap add Formula/gitter.rb
          git -C tap -c user.name='gitter-release-bot' -c user.email='noreply@github.com' \
            commit -m "gitter ${TAG}"
          git -C tap push

  # The end-user test: a fresh runner (native brew, current CLT) installs
  # from the tap exactly like a user would and checks the version.
  verify-tap:
    needs: update-tap
    if: needs.update-tap.outputs.updated == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: brew install from the tap
        env:
          TAG: ${{ github.ref_name }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install MoyezM/tap/gitter
          got="$(gitter -version)"
          echo "installed: $got"
          [ "$got" = "$TAG" ] || { echo "FAIL: expected $TAG, got $got" >&2; exit 1; }

  # The other end-user test: the curl|bash path on Linux, which is the only
  # way linux-x86_64 ever reaches anyone.
  verify-install-script:
    needs: publish
    # Both Linux assets, on the architecture each is actually for — curl|bash
    # is the only route by which either of them reaches anyone.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: install from the published release
        env:
          GITTER_VERSION: ${{ github.ref_name }}
        run: |
          ./scripts/install.sh
          got="$("$HOME/.local/bin/gitter" -version)"
          echo "installed: $got"
          [ "$got" = "$GITTER_VERSION" ] \
            || { echo "FAIL: expected $GITTER_VERSION, got $got" >&2; exit 1; }
