# Build + test on every push/PR to main. The opam root (custom OxCaml
# compiler, ~40 min to build cold) is cached whole; on a hit ./scripts/bootstrap
# is a no-op. Nix supplies system deps; the 'path:.' flake ref is required
# because the tree may contain untracked files.
name: ci

on:
  push:
    branches: [main]
  # no base-branch filter: Graphite stacked PRs target their PARENT branch,
  # not main — a [main] filter would leave mid-stack PRs without CI
  pull_request:

jobs:
  build-test:
    # All three published platforms. ubuntu-22.04 rather than -latest on
    # purpose: its glibc 2.35 is the floor the release binaries inherit, so
    # CI builds against exactly what release.yml ships. Every cache key below
    # is already keyed on runner.os/runner.arch, so the legs never collide —
    # the two ubuntu legs differ by arch (X64 vs ARM64).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@v35

      # Cache the nix store itself: the ci-shell closure otherwise
      # re-substitutes from cache.nixos.org every run (15-50s, high
      # variance — runners share bandwidth).
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      # Explicit restore/save (not the combined action): an EXACT key hit
      # means the switch matches gitter.opam bit-for-bit, so bootstrap can
      # be skipped outright; and saving right after bootstrap protects the
      # 40-min compiler build even when a later build/test step fails.
      - uses: actions/cache/restore@v4
        id: opam-cache
        with:
          path: ~/.opam
          key: opam-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gitter.opam', 'scripts/bootstrap', 'flake.lock') }}
          restore-keys: |
            opam-v3-${{ runner.os }}-${{ runner.arch }}-
            opam-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: bootstrap opam switch
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: nix develop path:. -c ./scripts/bootstrap

      - name: prune opam cache
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: ./scripts/ci-prune-opam

      - uses: actions/cache/save@v4
        if: steps.opam-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.opam
          key: opam-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gitter.opam', 'scripts/bootstrap', 'flake.lock') }}

      - name: build and test
        run: nix develop path:.#ci -c dune build bin/main.exe @runtest

  # Seconds, and guards a failure mode nothing else catches: the published
  # platform list is spelled out in three files that cannot share code, and
  # when they drift the release still succeeds — users just 404 on an asset
  # that was never built. See scripts/check-platforms.
  platforms-agree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-platforms
