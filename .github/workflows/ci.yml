# Build + test on every push/PR to main. The opam root (custom OxCaml
# compiler, ~40 min to build cold) is cached whole; on a hit ./scripts/bootstrap
# is a no-op. Nix supplies system deps; the 'path:.' flake ref is required
# because the tree may contain untracked files.
name: ci

on:
  push:
    branches: [main]
  # no base-branch filter: Graphite stacked PRs target their PARENT branch,
  # not main — a [main] filter would leave mid-stack PRs without CI
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@v35

      # Explicit restore/save (not the combined action): an EXACT key hit
      # means the switch matches gitter.opam bit-for-bit, so bootstrap can
      # be skipped outright; and saving right after bootstrap protects the
      # 40-min compiler build even when a later build/test step fails.
      - uses: actions/cache/restore@v4
        id: opam-cache
        with:
          path: ~/.opam
          key: opam-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gitter.opam', 'scripts/bootstrap', 'flake.lock') }}
          restore-keys: |
            opam-v3-${{ runner.os }}-${{ runner.arch }}-
            opam-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: bootstrap opam switch
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: nix develop path:. -c ./scripts/bootstrap

      - name: prune opam cache
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: ./scripts/ci-prune-opam

      - uses: actions/cache/save@v4
        if: steps.opam-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.opam
          key: opam-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gitter.opam', 'scripts/bootstrap', 'flake.lock') }}

      - name: build and test
        run: nix develop path:.#ci -c dune build bin/main.exe @runtest
